name: Paix checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_API_TESTS: '0'
      PAIX_TTS_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m app.diagnostics.cli validate
      - run: uv run python -m app.diagnostics.cli rebuild
      - run: uv run python -m app.diagnostics.cli smoke
  avatar-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project unity/Tests/ProtocolTests.csproj
  legacy-stage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stage/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
